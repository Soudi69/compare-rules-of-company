version: '3.8'

services:
  # Backend API service
  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: apte-backend
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - LOG_LEVEL=INFO
    # If you want to use a local Ollama LLM, add a service named `ollama` and
    # uncomment a depends_on entry here. By default we run backend without Ollama.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - apte-network
    restart: unless-stopped

  # Frontend service
  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
    container_name: apte-frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:5173/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - apte-network
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:8000

# Named volume for Ollama data persistence
volumes: {}

# Custom network for service communication
networks:
  apte-network:
    driver: bridge
